# Monta o AtreiaCode-Setup.exe e publica em Releases sozinho sempre que o programa muda no main.
# Link fixo para baixar a versão mais nova:
#   https://github.com/KrulTepesk/Atreia-Code/releases/latest/download/AtreiaCode-Setup.exe
name: Gerar instalador
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["overlay/**", "build_tools/**", "requirements.txt", ".github/workflows/instalador.yml"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m pip install pillow && python build_tools/baixar_icones.py
      - run: python -m PyInstaller --noconfirm --distpath dist --workpath build_tools/_work build_tools/AtreiaCode.spec
      - name: Tamanho do programa (maiores arquivos)
        shell: pwsh
        run: |
          $all = Get-ChildItem dist\AtreiaCode -Recurse -File
          $tot = ($all | Measure-Object Length -Sum).Sum / 1MB
          echo ("::notice title=Total::{0:N1} MB em {1} arquivos" -f $tot, $all.Count)
          $all | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object {
            echo ("::notice title=Arquivo::{0:N1} MB  {1}" -f ($_.Length/1MB), $_.FullName.Substring((Resolve-Path dist\AtreiaCode).Path.Length))
          }
      - name: Abrir o programa (confere que não falta nada)
        shell: pwsh
        run: |
          $p = Start-Process dist\AtreiaCode\AtreiaCode.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "O AtreiaCode.exe fechou sozinho (código $($p.ExitCode))" }
          echo "::notice title=Teste::o programa abriu e continuou rodando"
          Stop-Process -Id $p.Id -Force
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.${{ github.run_number }} build_tools\instalador.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AtreiaCode-Setup
          path: saida/AtreiaCode-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Atreia Code 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: saida/AtreiaCode-Setup.exe
          body: |
            **Como instalar:** baixe o `AtreiaCode-Setup.exe` abaixo, abra e siga as telas.
            Não precisa de Python nem de nada além do instalador.
            O Npcap só é necessário para o medidor de DPS (o instalador oferece instalar).
