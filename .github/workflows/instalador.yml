# Monta o MetaOverlay-Setup.exe e publica em Releases sozinho sempre que o programa muda no main.
# Link fixo para baixar a versão mais nova:
#   https://github.com/KrulTepesk/Meta-Overlay/releases/latest/download/MetaOverlay-Setup.exe
name: Gerar instalador
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["overlay/**", "build_tools/**", "requirements.txt", ".github/workflows/instalador.yml"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m pip install pillow && python build_tools/baixar_icones.py
      - name: Npcap (confere a assinatura e fixa o SHA-256 no app e no instalador)
        shell: pwsh
        run: |
          $url = "https://npcap.com/dist/npcap-1.89.exe"
          $sha = ""
          try {
            Invoke-WebRequest $url -OutFile npcap.exe -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
            $sig = Get-AuthenticodeSignature -LiteralPath npcap.exe
            $subj = "$($sig.SignerCertificate.Subject)"
            echo "::notice title=Npcap assinatura::$($sig.Status) | $subj"
            if ($sig.Status -eq "Valid" -and $subj -match "O=Nmap Software LLC") {
              $sha = (Get-FileHash npcap.exe -Algorithm SHA256).Hash.ToLower()
              @{ url = $url; sha256 = $sha } | ConvertTo-Json | Set-Content -Encoding utf8 overlay\data\npcap.json
              echo "::notice title=Npcap SHA-256::$sha"
            } else {
              throw "assinatura do Npcap inesperada: $($sig.Status) $subj"
            }
            Remove-Item npcap.exe -ErrorAction SilentlyContinue
          } catch {
            if ("$_" -match "assinatura do Npcap") { throw }      # arquivo adulterado: não publica
            echo "::warning title=Npcap::não deu para baixar no build: $($_.Exception.Message)"
          }
          "NPCAP_SHA256=$sha" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: python -m PyInstaller --noconfirm --distpath dist --workpath build_tools/_work build_tools/MetaOverlay.spec
      - name: Tamanho do programa (maiores arquivos)
        shell: pwsh
        run: |
          $all = Get-ChildItem dist\MetaOverlay -Recurse -File
          $tot = ($all | Measure-Object Length -Sum).Sum / 1MB
          echo ("::notice title=Total::{0:N1} MB em {1} arquivos" -f $tot, $all.Count)
          $all | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object {
            echo ("::notice title=Arquivo::{0:N1} MB  {1}" -f ($_.Length/1MB), $_.FullName.Substring((Resolve-Path dist\MetaOverlay).Path.Length))
          }
      - name: Abrir o programa (confere que não falta nada)
        shell: pwsh
        run: |
          $p = Start-Process dist\MetaOverlay\MetaOverlay.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "O MetaOverlay.exe fechou sozinho (código $($p.ExitCode))" }
          echo "::notice title=Teste::o programa abriu e continuou rodando"
          # abrir de novo pelo atalho: não pode ficar com dois abertos
          Start-Process dist\MetaOverlay\MetaOverlay.exe
          Start-Sleep -Seconds 8
          $n = @(Get-Process MetaOverlay -ErrorAction SilentlyContinue).Count
          if ($n -ne 1) { throw "abrir de novo deixou $n cópias abertas" }
          # --replace (reiniciar / atualizar): a antiga fecha e a nova fica
          Start-Process dist\MetaOverlay\MetaOverlay.exe -ArgumentList "--replace"
          Start-Sleep -Seconds 15
          $procs = @(Get-Process MetaOverlay -ErrorAction SilentlyContinue)
          if ($procs.Count -ne 1) { throw "--replace deixou $($procs.Count) cópias abertas" }
          if ($procs[0].Id -eq $p.Id) { throw "--replace não fechou a cópia antiga" }
          echo "::notice title=Teste::uma cópia só (abrir de novo e --replace)"
          Get-Process MetaOverlay -ErrorAction SilentlyContinue | Stop-Process -Force
      - run: choco install innosetup -y --no-progress
      - name: Gerar o instalador
        shell: pwsh
        run: |
          $args = @("/DAppVersion=1.0.${{ github.run_number }}")
          if ($env:NPCAP_SHA256) { $args += "/DNpcapSha256=$env:NPCAP_SHA256" }   # vazio: fica o hash fixo do .iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @args build_tools\instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou ($LASTEXITCODE)" }
      - name: Testar atualizacao (instala 2x e confere que nao sobra arquivo velho)
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\MetaOverlay"
          Start-Process saida\MetaOverlay-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/TASKS=""' -Wait
          if (-not (Test-Path "$dir\MetaOverlay.exe")) { throw "1a instalacao falhou" }
          New-Item "$dir\_internal\arquivo_velho.dll" -ItemType File -Force | Out-Null
          Start-Process saida\MetaOverlay-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/TASKS=""' -Wait
          if (-not (Test-Path "$dir\MetaOverlay.exe")) { throw "2a instalacao falhou" }
          if (Test-Path "$dir\_internal\arquivo_velho.dll") { throw "sobrou arquivo da versao anterior" }
          Get-Process MetaOverlay -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MetaOverlay-Setup
          path: saida/MetaOverlay-Setup.exe
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meta Overlay 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            saida/MetaOverlay-Setup.exe
          body: |
            **Como instalar:** baixe o `MetaOverlay-Setup.exe` abaixo, abra e siga as telas.
            Não precisa de Python nem de nada além do instalador.
            O Npcap só é necessário para o medidor de DPS (o instalador oferece instalar).
