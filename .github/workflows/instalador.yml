# Alternativa: o GitHub monta o instalador sozinho (aba Actions > "Gerar instalador" > Run workflow).
name: Gerar instalador
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m pip install pillow && python build_tools/baixar_icones.py
      - run: python -m PyInstaller --noconfirm --distpath dist --workpath build_tools/_work build_tools/AtreiaCode.spec
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build_tools\instalador.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AtreiaCode-Setup
          path: saida/AtreiaCode-Setup.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: saida/AtreiaCode-Setup.exe
